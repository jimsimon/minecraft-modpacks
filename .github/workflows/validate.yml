name: Validate packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install packwiz
        run: scripts/install-packwiz.sh

      - name: Export every pack
        run: |
          set -euo pipefail
          for dir in packs/*/; do
            scripts/export.sh "$(basename "$dir")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mrpacks
          path: dist/*.mrpack
          if-no-files-found: error
