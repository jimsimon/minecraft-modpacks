# Radical Cobblemon Trainers server config, shipped by the modpack.
# Spawn rate cut to roughly a fifth of the mod defaults, no ambush battles,
# progression/level caps off. Defaults for comparison in the pack README.

[Spawning]
	globalSpawnChance = 0.5
	globalSpawnChanceMinimum = 0.1
	spawnIntervalTicks = 600
	spawnIntervalTicksMaximum = 2400
	despawnTicksIfUnseen = 6000
	maxHorizontalDistanceToPlayers = 70
	minHorizontalDistanceToPlayers = 25
	maxVerticalDistanceToPlayers = 30
	uniqueTrainerRadius = 500
	maxTrainersPerPlayer = 4
	maxTrainersTotal = 24
	maxLevelDiff = 25
	spawningRequiresTrainerCard = false
	spawnTrainerAssociation = true
	dimensionBlacklist = []
	dimensionWhitelist = []
	biomeTagBlacklist = []
	biomeTagWhitelist = []

[Trainers]
	forceBattleOnSight = false
	forceBattleMaxDistance = 8.0
	forceBattleLookTicks = 60
	forceBattleMaxLevelDiff = 16
	showMessagesAsSpeechBubble = true
	showMessagesInChat = false

[Players]
	initialLevelCap = 100
	relativeLevelCap = 0
	initialSeries = "freeroam"
	freeroamRequiresCompletedSeries = false
	allowOverLeveling = true

[Debug]
	logSpawning = false
	logRepelRods = false
