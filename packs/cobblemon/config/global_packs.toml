# Global Packs: load the pack's bundled datapacks on every world without
# copying them into world/datapacks. Paths are relative to the server directory.
config_version = 4
enable_system_global_packs = false
log_pack_ids = false

[resourcepacks]
	required = []
	enable_builtin = []

[datapacks]
	required = ["datapacks/"]
	optional = []
	enable_builtin = []
