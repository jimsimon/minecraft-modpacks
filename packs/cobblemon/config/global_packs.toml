# Global Packs: load the pack's bundled data/resource packs on every world and
# client without copying them into world/datapacks or enabling them by hand.
# Paths are relative to the instance/server directory.
#   datapacks/  - server-side gameplay datapacks (no-hunger, keep-inventory)
#   addons/     - combined data+resource packs (AllTheMons x Mega Showdown);
#                 loaded as datapacks on the server and as resource packs on clients
config_version = 4
enable_system_global_packs = false
log_pack_ids = false

[resourcepacks]
	required = ["addons/"]
	enable_builtin = []

[datapacks]
	required = ["datapacks/", "addons/"]
	optional = []
	enable_builtin = []
